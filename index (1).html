<title>KANA Word Battle</title>

<style>
:root{--bg:#10162f;--card:#1b2450;--ink:#f4f6ff;--mute:#9aa6d6;--acc:#ffd23f;--ok:#2ecc71;--bad:#ff5a5f;--blue:#3d7bff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:16px;min-height:100vh}
h1{font-size:26px;margin:8px 0 4px;letter-spacing:.5px}
h2{font-size:19px;margin:18px 0 8px}
p{color:var(--mute);line-height:1.5}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0}
button,select,input,textarea{font:inherit;color:inherit}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-weight:700;font-size:17px;margin:8px 0;cursor:pointer}
.btn.gold{background:var(--acc);color:#1a1a1a}
.btn.ghost{background:transparent;border:2px solid #3a4580;color:var(--ink)}
.btn.small{display:inline-block;width:auto;padding:8px 12px;font-size:14px;margin:4px 4px 4px 0}
.btn:disabled{opacity:.45}
select,input,textarea{width:100%;padding:12px;border-radius:12px;border:2px solid #3a4580;background:#121a3d;margin:6px 0}
textarea{min-height:120px}
.opt{display:block;width:100%;text-align:left;padding:16px;border-radius:14px;border:2px solid #3a4580;background:#121a3d;font-size:18px;margin:10px 0;cursor:pointer}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#06230f;font-weight:700}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:#2b3670;color:var(--acc);letter-spacing:.5px}
.prompt{font-size:26px;font-weight:800;margin:14px 0 4px;line-height:1.3}
.sub{color:var(--mute);font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.timer{font-size:22px;font-variant-numeric:tabular-nums;color:var(--acc)}
.timer.low{color:var(--bad)}
.prog{height:8px;background:#2b3670;border-radius:9px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--acc);transition:width .2s}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#121a3d;margin:6px 0}
.row.me{outline:2px solid var(--acc)}
.row .rk{width:34px;font-weight:800;font-size:18px;text-align:center}
.row .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sc{font-weight:800;font-variant-numeric:tabular-nums;color:var(--acc)}
.row .xs{font-size:12px;color:var(--mute)}
.big{font-size:54px;font-weight:900;text-align:center;color:var(--acc);margin:8px 0}
.center{text-align:center}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names .opt{margin:0;font-size:16px;padding:14px 10px;text-align:center}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;padding:10px 4px;border-radius:12px;border:0;background:#1b2450;color:var(--mute);font-weight:700}
.tabs button.on{background:var(--blue);color:#fff}
#qr{background:#fff;padding:14px;border-radius:14px;display:inline-block}
.chip{display:inline-block;background:#2b3670;border-radius:99px;padding:6px 12px;margin:3px;font-size:14px}
.err{color:var(--bad);font-weight:600}
@media(min-width:900px){#app.wide{max-width:900px}}
</style>
</head>

/* ===================== QUIZ BUILDER ===================== */
function rngOf(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const WORDS=RAW.trim().split('\n').map(l=>{const p=l.split('|');return{en:p[0],ja:p[1],p:+p[2]}}).sort((x,y)=>x.p-y.p);
const N_LESSONS=42;
const LESSONS=[];
(function(){const per=WORDS.length/N_LESSONS;for(let i=0;i<N_LESSONS;i++)LESSONS.push(WORDS.slice(Math.round(i*per),Math.round((i+1)*per)))})();
function lessonLabel(n){const L=LESSONS[n-1];return 'Lesson '+n+' (p.'+L[0].p+'–'+L[L.length-1].p+')'}
const VERB_Q=(function(){const r=rngOf(4242),a=[];VERBS.forEach(v=>{a.push([v,1]);a.push([v,2]);a.push([v,3])});return shuf(a,r)})();
const COMP_Q=(function(){const r=rngOf(1717),a=[];COMPS.forEach(c=>{a.push([c,1]);a.push([c,2])});return shuf(a,r)})();
function uniq(a){return a.filter((x,i)=>a.indexOf(x)===i)}
function mk(tag,prompt,sub,ans,wrong,r){const opts=shuf([ans].concat(wrong.slice(0,3)),r);return{tag,prompt,sub,opts,ans:opts.indexOf(ans)}}
function buildQuiz(n){
  const r=rngOf(n*7919+13),qs=[],L=LESSONS[n-1];
  shuf(L,r).slice(0,10).forEach((w,i)=>{
    const f=i%2===0?'ja':'en',g=f==='ja'?'en':'ja';
    const wrong=uniq(shuf(WORDS,r).filter(x=>x[f]!==w[f]&&x.en!==w.en).map(x=>x[f])).slice(0,3);
    qs.push(mk('VOCAB 単語',w[g],f==='ja'?'日本語の意味は？':'英語で言うと？',w[f],wrong,r));
  });
  for(let k=0;k<4;k++){
    const it=VERB_Q[((n-1)*4+k)%VERB_Q.length],v=it[0],f=it[1];
    const name=['','過去形','過去分詞','-ing形'][f],ans=v[f];
    const cand=uniq([v[0]+'ed',v[1],v[2],v[0]+'en',v[3],v[0]+'s',v[0]+'ing',v[0]]).filter(x=>x!==ans);
    qs.push(mk('VERB 動詞の活用',v[0],name+' はどれ？',ans,shuf(cand,r),r));
  }
  for(let k=0;k<2;k++){
    const it=COMP_Q[((n-1)*2+k)%COMP_Q.length],c=it[0],f=it[1],ans=c[f];
    const cand=uniq([c[1],c[2],'more '+c[0],'most '+c[0],c[0]+'er',c[0]+'est',c[0]+'ier']).filter(x=>x!==ans);
    qs.push(mk('COMPARE 比較',c[0],(f===1?'比較級':'最上級')+' はどれ？',ans,shuf(cand,r),r));
  }
  for(let k=0;k<4;k++){
    const g=GRAMMAR[((n-1)*4+k)%GRAMMAR.length];
    qs.push(mk('GRAMMAR 文法',g[0],'___ に入るのは？',g[1],g.slice(2),r));
  }
  return shuf(qs,r);
}

    const q=S.qs[i];locked=false;
    app.innerHTML='<div class="bar"><span>'+(i+1)+' / '+total+'</span><span>⭐ '+S.row.score+'</span><span id="tm" class="timer">'+fmt((endsAt(S.ses)-now())/1000)+'</span></div><div class="prog"><i style="width:'+(i/total*100)+'%"></i></div><div class="card"><span class="tag">'+q.tag+'</span><div class="prompt">'+esc(q.prompt)+'</div><div class="sub">'+esc(q.sub)+'</div></div>'+q.opts.map((o,k)=>'<button class="opt" data-k="'+k+'">'+esc(o)+'</button>').join('');
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(locked)return;locked=true;
      const k=+b.dataset.k,ok=k===q.ans;
      app.querySelectorAll('.opt')[q.ans].classList.add('ok');
      if(!ok)b.classList.add('bad');
      if(ok){S.row.score+=POINTS;S.row.correct++}
      S.row.answered=++i;
      push();
      setTimeout(draw,ok?450:1300);
    });
  }
  draw();
}
function showBoard(S){
  if(S.mode==='board')return;S.mode='board';clearTimers();
  every(3000,async()=>{
    const[{data:rows},{data:ses}]=await Promise.all([sb.from('quiz_scores').select('*').eq('session_id',S.ses.id).order('score',{ascending:false}),sb.from('quiz_sessions').select('*').eq('id',S.ses.id).single()]);
    if(ses)S.ses=ses;if(!rows)return;
    const left=S.ses.started_at?(endsAt(S.ses)-now())/1000:0,over=S.ses.status==='done'||left<=0;
    const my=rows.findIndex(r=>r.student_id===S.meId),me=rows[my]||S.row;
    app.innerHTML='<h1>'+(over?'🏆 RESULTS':'⏳ Finished!')+'</h1><div class="card center"><p>'+esc(S.st.map[S.meId])+'</p><div class="big">'+me.score+'</div><p>'+me.correct+' / '+S.qs.length+' correct'+(over?' ・ '+(my+1)+'位 / '+rows.length+'人':'')+'</p>'+(over?'':'<p>のこり '+fmt(left)+' — 結果発表を待ってね</p>')+'</div>'+(over?'<h2>Leaderboard</h2>'+boardHTML(rows,S.st.map,S.meId,10)+(my>=10?'<p class="center">…</p>'+boardHTML([rows[my]],S.st.map,S.meId).replace(/<div class="rk">.*?<\/div>/,'<div class="rk">'+(my+1)+'</div>'):''):'');
  });
}

/* ===================== TEACHER ===================== */
let T={tab:'run',classes:[],classId:''};
function teacherGate(){
  let ok=false;try{ok=sessionStorage.getItem('quiz_t')==='1'}catch(e){}
  if(ok)return teacherHome();
  app.innerHTML='<h1>⚔️ KANA Word Battle</h1><p>Students: scan the QR code your teacher shows.</p><div class="card"><h2>Teacher</h2><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button class="btn" id="go">Enter</button></div>';
  document.getElementById('go').onclick=()=>{if(document.getElementById('pin').value===TEACHER_PIN){try{sessionStorage.setItem('quiz_t','1')}catch(e){}teacherHome()}else alert('Wrong PIN')};
}
async function loadClasses(){const{data,error}=await sb.from('quiz_classes').select('*').order('name');if(error)throw error;T.classes=data;if(!T.classId&&data[0])T.classId=data[0].id}
function classSelect(id,all){return '<select id="'+id+'">'+(all?'<option value="">All classes</option>':'')+T.classes.map(c=>'<option value="'+c.id+'"'+(c.id===T.classId?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select>'}
async function teacherHome(){
  clearTimers();app.className='wide';
  try{await loadClasses()}catch(e){return fail(e)}
  const tabs=[['run','▶ Run a quiz'],['roster','👥 Roster'],['season','🏆 Season']];
  app.innerHTML='<h1>⚔️ Word Battle — Teacher</h1><div class="tabs">'+tabs.map(t=>'<button data-t="'+t[0]+'" class="'+(T.tab===t[0]?'on':'')+'">'+t[1]+'</button>').join('')+'</div><div id="pane"></div>';
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{T.tab=b.dataset.t;teacherHome()});
  const pane=document.getElementById('pane');
  ({run:paneRun,roster:paneRoster,season:paneSeason})[T.tab](pane).catch(fail);
}
async function paneRun(pane){
  if(!T.classes.length){pane.innerHTML='<div class="card"><p>Add a class and students in the Roster tab first.</p></div>';return}
  pane.innerHTML='<div class="card"><label>Class</label>'+classSelect('cls')+'<label>Lesson</label><select id="les">'+LESSONS.map((L,i)=>'<option value="'+(i+1)+'">'+esc(lessonLabel(i+1))+'</option>').join('')+'</select><button class="btn gold" id="mk">Create game + QR code</button><button class="btn ghost" id="pv">Preview questions</button></div><div id="pvout"></div>';
  const last=mem('quiz_last_lesson');if(last)document.getElementById('les').value=Math.min(N_LESSONS,+last+1);
  document.getElementById('cls').onchange=e=>T.classId=e.target.value;
  document.getElementById('pv').onclick=()=>{const n=+document.getElementById('les').value;document.getElementById('pvout').innerHTML='<div class="card"><h2>'+esc(lessonLabel(n))+'</h2><p>Words: '+LESSONS[n-1].map(w=>esc(w.en)).join(', ')+'</p>'+buildQuiz(n).map((q,i)=>'<div class="row"><div class="rk">'+(i+1)+'</div><div class="nm" style="white-space:normal">'+esc(q.prompt)+' <span class="xs">'+esc(q.sub)+'</span><br><b style="color:var(--ok)">'+esc(q.opts[q.ans])+'</b> <span class="xs">/ '+q.opts.filter((o,k)=>k!==q.ans).map(esc).join(' / ')+'</span></div></div>').join('')+'</div>'};
  document.getElementById('mk').onclick=async()=>{
    const lesson=+document.getElementById('les').value;
    const{data,error}=await sb.from('quiz_sessions').insert({class_id:T.classId,lesson}).select().single();
    if(error)return fail(error);
    mem('quiz_last_lesson',lesson);location.href=location.pathname+'?host='+data.id;
  };
}
async function hostGame(sid){
  clearTimers();app.className='wide';
  try{
    await syncClock();
    let{data:ses,error}=await sb.from('quiz_sessions').select('*').eq('id',sid).single();if(error)throw error;
    const st=await namesOf(ses.class_id),url=location.origin+location.pathname+'?s='+sid;
    app.innerHTML='<h1>'+esc(lessonLabel(ses.lesson))+'</h1><div id="top"></div><h2 id="bh"></h2><div id="board"></div><button class="btn ghost" id="back">← Back to teacher menu</button>';
    document.getElementById('back').onclick=()=>{location.href=location.pathname+'?teacher=1'};
    const top=document.getElementById('top');let drawn='';
    function drawTop(){
      if(drawn===ses.status)return;drawn=ses.status;
      if(ses.status==='lobby'){
        top.innerHTML='<div class="card center"><div id="qr"></div><p style="word-break:break-all">'+esc(url)+'</p><button class="btn gold" id="st">START (5:00)</button></div>';
        new QRCode(document.getElementById('qr'),{text:url,width:240,height:240});
        document.getElementById('st').onclick=async()=>{const{error}=await sb.rpc('quiz_start',{sid});if(error)return fail(error);const r=await sb.from('quiz_sessions').select('*').eq('id',sid).single();ses=r.data;drawTop()};
      }else if(ses.status==='live'){
        top.innerHTML='<div class="card center"><div class="big" id="ht">5:00</div><button class="btn small ghost" id="end">End now</button></div>';
        document.getElementById('end').onclick=()=>{if(confirm('End the quiz now?'))finishHost()};
      }else top.innerHTML='<div class="card center"><div class="big">🏆 FINAL</div></div>';
    }
    async function finishHost(){await sb.from('quiz_sessions').update({status:'done'}).eq('id',sid);ses.status='done';drawTop()}
    every(500,()=>{if(ses.status!=='live')return;const left=(endsAt(ses)-now())/1000,el=document.getElementById('ht');if(el)el.textContent=fmt(left);if(left<=0)finishHost()});
    every(2000,async()=>{
      drawTop();
      const{data:rows}=await sb.from('quiz_scores').select('*').eq('session_id',sid).order('score',{ascending:false});if(!rows)return;
      if(ses.status==='lobby'){document.getElementById('bh').textContent='Joined: '+rows.length+' / '+st.list.length;document.getElementById('board').innerHTML=rows.map(r=>'<span class="chip">'+esc(st.map[r.student_id]||'?')+'</span>').join('')}
      else{document.getElementById('bh').textContent=ses.status==='live'?'Live scores':'Leaderboard';document.getElementById('board').innerHTML=boardHTML(rows,st.map)}
    });
  }catch(e){fail(e)}
}
async function paneRoster(pane){
  const st=T.classId?await namesOf(T.classId):{list:[]};
  pane.innerHTML='<div class="card"><h2>Classes</h2>'+(T.classes.length?classSelect('cls'):'<p>No classes yet.</p>')+'<input id="cn" placeholder="New class name (e.g. JHS2 Tuesday)"><button class="btn" id="addc">Add class</button>'+(T.classId?'<button class="btn small ghost" id="delc">Delete this class</button>':'')+'</div>'+(T.classId?'<div class="card"><h2>Students ('+st.list.length+')</h2>'+st.list.map(s=>'<span class="chip">'+esc(s.name)+' <a href="#" data-id="'+s.id+'" style="color:var(--bad);text-decoration:none">✕</a></span>').join('')+'<textarea id="names" placeholder="Paste names, one per line"></textarea><button class="btn" id="adds">Add students</button></div>':'');
  const cls=document.getElementById('cls');if(cls)cls.onchange=e=>{T.classId=e.target.value;teacherHome()};
  document.getElementById('addc').onclick=async()=>{const name=document.getElementById('cn').value.trim();if(!name)return;const{data,error}=await sb.from('quiz_classes').insert({name}).select().single();if(error)return fail(error);T.classId=data.id;teacherHome()};
  const delc=document.getElementById('delc');if(delc)delc.onclick=async()=>{if(!confirm('Delete this class, its students AND all their scores?'))return;await sb.from('quiz_classes').delete().eq('id',T.classId);T.classId='';teacherHome()};
  const adds=document.getElementById('adds');if(adds)adds.onclick=async()=>{const rows=document.getElementById('names').value.split('\n').map(s=>s.trim()).filter(Boolean).map(name=>({name,class_id:T.classId}));if(!rows.length)return;const{error}=await sb.from('quiz_students').insert(rows);if(error)return fail(error);teacherHome()};
  pane.querySelectorAll('a[data-id]').forEach(a=>a.onclick=async e=>{e.preventDefault();if(!confirm('Remove this student and their scores?'))return;await sb.from('quiz_students').delete().eq('id',a.dataset.id);teacherHome()});
}
async function paneSeason(pane){
  pane.innerHTML='<div class="card">'+classSelect('cls',true)+'</div><div id="sb"></div>';
  const sel=document.getElementById('cls');
  async function load(){
    const cid=sel.value;let q=sb.from('quiz_scores').select('student_id,lesson,score,correct,answered');if(cid)q=q.eq('class_id',cid);
    const[{data:rows,error},st]=await Promise.all([q.limit(10000),namesOf(cid)]);if(error)return fail(error);
    const best={};rows.forEach(r=>{const k=r.student_id+'|'+r.lesson;if(!best[k]||r.score>best[k].score)best[k]=r});
    const tot={};Object.values(best).forEach(r=>{const t=tot[r.student_id]||(tot[r.student_id]={student_id:r.student_id,score:0,correct:0,answered:0,n:0});t.score+=r.score;t.correct+=r.correct;t.answered+=r.answered;t.n++});
    const list=Object.values(tot).sort((a,b)=>b.score-a.score);
    document.getElementById('sb').innerHTML='<h2>Season total (best score per lesson)</h2>'+(list.length?list.map((r,i)=>'<div class="row"><div class="rk">'+medal(i)+'</div><div class="nm">'+esc(st.map[r.student_id]||'?')+'</div><div class="xs">'+r.n+' quizzes ・ '+(r.answered?Math.round(r.correct/r.answered*100):0)+'%</div><div class="sc">'+r.score+'</div></div>').join(''):'<p>No scores yet.</p>');
  }
  sel.onchange=load;await load();
}

/* ===================== ROUTER ===================== */
(function(){
  const p=new URLSearchParams(location.search);
  if(p.get('s'))studentInit(p.get('s'));
  else if(p.get('host'))hostGame(p.get('host'));
  else teacherGate();
})();
</script>
